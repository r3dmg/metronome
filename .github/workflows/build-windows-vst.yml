name: Build Windows VST3

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'vst-plugin/**'
      - '.github/workflows/build-windows-vst.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        working-directory: vst-plugin
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        working-directory: vst-plugin
        run: cmake --build build --config Release

      - name: Zip VST3
        working-directory: vst-plugin/build/MetronomeVST_artefacts/Release/VST3
        run: |
          powershell Compress-Archive -Path Metronome.vst3 -DestinationPath ${{ github.workspace }}/Metronome-Windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Metronome-Windows-VST3
          path: Metronome-Windows-x64.zip
          retention-days: 90

      - name: Publish to GitHub Releases (public download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view metronome-windows --repo ${{ github.repository }} 2>/dev/null \
            || gh release create metronome-windows \
                 --repo ${{ github.repository }} \
                 --title "Metronome — Windows VST3" \
                 --notes "Распакуйте zip и скопируйте папку Metronome.vst3 в C:\Program Files\Common Files\VST3\ затем Refresh в FL Studio."
          gh release upload metronome-windows Metronome-Windows-x64.zip --repo ${{ github.repository }} --clobber
